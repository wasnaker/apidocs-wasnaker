openapi: 3.0.3
info:
  title: 'Wasnaker API API Documentation'
  description: 'API resmi platform Wasnaker. Kontrak konsisten untuk semua frontend (web/mobile). Autentikasi via Laravel Sanctum (Bearer token).'
  version: 1.0.0
servers:
  -
    url: 'http://wasnaker.lan'
tags:
  -
    name: 'Activity Logs'
    description: ''
  -
    name: 'Custom Meta'
    description: ''
  -
    name: Endpoints
    description: ''
  -
    name: Files
    description: ''
  -
    name: GDPR
    description: ''
  -
    name: Mail
    description: ''
  -
    name: Modules
    description: ''
  -
    name: Payment
    description: ''
  -
    name: Relations
    description: ''
  -
    name: Settings
    description: ''
  -
    name: Utilities
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/activity-logs:
    get:
      summary: 'List log aktivitas.'
      operationId: listLogAktivitas
      description: ''
      parameters:
        -
          in: query
          name: tenant_id
          description: 'optional Filter scope tenant.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'optional Filter scope tenant.'
            example: 1
        -
          in: query
          name: causer_id
          description: 'optional Filter berdasar user id (causer).'
          example: 1
          required: false
          schema:
            type: integer
            description: 'optional Filter berdasar user id (causer).'
            example: 1
        -
          in: query
          name: subject_type
          description: 'optional Filter tipe subjek.'
          example: App\Models\Invoice
          required: false
          schema:
            type: string
            description: 'optional Filter tipe subjek.'
            example: App\Models\Invoice
        -
          in: query
          name: subject_id
          description: 'optional Filter id subjek.'
          example: 5
          required: false
          schema:
            type: integer
            description: 'optional Filter id subjek.'
            example: 5
        -
          in: query
          name: per_page
          description: 'optional Jumlah per halaman.'
          example: 15
          required: false
          schema:
            type: integer
            description: 'optional Jumlah per halaman.'
            example: 15
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      description: 'Invoice dibuat'
                      subject_type: App\Models\Invoice
                      subject_id: 5
                      causer_type: App\Models\User
                      causer_id: 1
                      tenant_id: 1
                      properties:
                        ip: 127.0.0.1
                      created_at: '2026-08-28T00:00:00+00:00'
                  meta:
                    current_page: 1
                    per_page: 15
                    total: 1
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        description: 'Invoice dibuat'
                        subject_type: App\Models\Invoice
                        subject_id: 5
                        causer_type: App\Models\User
                        causer_id: 1
                        tenant_id: 1
                        properties:
                          ip: 127.0.0.1
                        created_at: '2026-08-28T00:00:00+00:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        description:
                          type: string
                          example: 'Invoice dibuat'
                        subject_type:
                          type: string
                          example: App\Models\Invoice
                        subject_id:
                          type: integer
                          example: 5
                        causer_type:
                          type: string
                          example: App\Models\User
                        causer_id:
                          type: integer
                          example: 1
                        tenant_id:
                          type: integer
                          example: 1
                        properties:
                          type: object
                          properties:
                            ip:
                              type: string
                              example: 127.0.0.1
                        created_at:
                          type: string
                          example: '2026-08-28T00:00:00+00:00'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 15
                      total:
                        type: integer
                        example: 1
      tags:
        - 'Activity Logs'
    post:
      summary: 'Catat log aktivitas baru.'
      operationId: catatLogAktivitasBaru
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  description: 'Invoice dibuat'
                  subject_type: App\Models\Invoice
                  subject_id: 5
                  causer_type: App\Models\User
                  causer_id: 1
                  tenant_id: 1
                  properties:
                    ip: 127.0.0.1
                  created_at: '2026-08-28T00:00:00+00:00'
                properties:
                  id:
                    type: integer
                    example: 1
                  description:
                    type: string
                    example: 'Invoice dibuat'
                  subject_type:
                    type: string
                    example: App\Models\Invoice
                  subject_id:
                    type: integer
                    example: 5
                  causer_type:
                    type: string
                    example: App\Models\User
                  causer_id:
                    type: integer
                    example: 1
                  tenant_id:
                    type: integer
                    example: 1
                  properties:
                    type: object
                    properties:
                      ip:
                        type: string
                        example: 127.0.0.1
                  created_at:
                    type: string
                    example: '2026-08-28T00:00:00+00:00'
      tags:
        - 'Activity Logs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: 'Deskripsi aktivitas.'
                  example: 'Invoice dibuat'
                subject_type:
                  type: string
                  description: 'optional Tipe subjek (FQCN).'
                  example: App\Models\Invoice
                  nullable: true
                subject_id:
                  type: integer
                  description: 'optional ID subjek.'
                  example: 5
                  nullable: true
                causer_id:
                  type: integer
                  description: 'optional ID user penyebab.'
                  example: 1
                  nullable: true
                tenant_id:
                  type: integer
                  description: 'optional Scope tenant.'
                  example: 1
                  nullable: true
                properties:
                  type: object
                  description: 'optional Data tambahan.'
                  example:
                    ip: 127.0.0.1
                  properties: {  }
                  nullable: true
              required:
                - description
  '/api/activity-logs/{id}':
    get:
      summary: 'Ambil satu log aktivitas.'
      operationId: ambilSatuLogAktivitas
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  description: 'Invoice dibuat'
                  subject_type: App\Models\Invoice
                  subject_id: 5
                  causer_type: App\Models\User
                  causer_id: 1
                  tenant_id: 1
                  properties:
                    ip: 127.0.0.1
                  created_at: '2026-08-28T00:00:00+00:00'
                properties:
                  id:
                    type: integer
                    example: 1
                  description:
                    type: string
                    example: 'Invoice dibuat'
                  subject_type:
                    type: string
                    example: App\Models\Invoice
                  subject_id:
                    type: integer
                    example: 5
                  causer_type:
                    type: string
                    example: App\Models\User
                  causer_id:
                    type: integer
                    example: 1
                  tenant_id:
                    type: integer
                    example: 1
                  properties:
                    type: object
                    properties:
                      ip:
                        type: string
                        example: 127.0.0.1
                  created_at:
                    type: string
                    example: '2026-08-28T00:00:00+00:00'
        404:
          description: tidak
          content:
            text/plain:
              schema:
                type: string
                example: "ditemukan {\n  \"message\": \"Activity log not found\"\n}"
      tags:
        - 'Activity Logs'
    delete:
      summary: 'Hapus log aktivitas.'
      operationId: hapusLogAktivitas
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Activity log deleted'
                properties:
                  message:
                    type: string
                    example: 'Activity log deleted'
        404:
          description: tidak
          content:
            text/plain:
              schema:
                type: string
                example: "ditemukan {\n  \"message\": \"Activity log not found\"\n}"
      tags:
        - 'Activity Logs'
    parameters:
      -
        in: path
        name: id
        description: 'ID log.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/meta/{type}/{id}':
    get:
      summary: 'Ambil semua meta entity.'
      operationId: ambilSemuaMetaEntity
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    theme: dark
                    language: id
                properties:
                  data:
                    type: object
                    properties:
                      theme:
                        type: string
                        example: dark
                      language:
                        type: string
                        example: id
      tags:
        - 'Custom Meta'
    post:
      summary: 'Bulk set meta (replace) untuk entity.'
      operationId: bulkSetMetareplaceUntukEntity
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    theme: dark
                    language: id
                properties:
                  data:
                    type: object
                    properties:
                      theme:
                        type: string
                        example: dark
                      language:
                        type: string
                        example: id
      tags:
        - 'Custom Meta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                meta:
                  type: object
                  description: 'Map key=>value.'
                  example:
                    theme: dark
                    language: id
                  properties: {  }
              required:
                - meta
    parameters:
      -
        in: path
        name: type
        description: 'Short entity type (allowlist).'
        example: user
        required: true
        schema:
          type: string
      -
        in: path
        name: id
        description: 'Entity id.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/meta/{type}/{id}/{key}':
    get:
      summary: 'Ambil satu meta by key.'
      operationId: ambilSatuMetaByKey
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  key: theme
                  value: dark
                properties:
                  key:
                    type: string
                    example: theme
                  value:
                    type: string
                    example: dark
        404:
          description: tidak
          content:
            text/plain:
              schema:
                type: string
                example: "ditemukan {\n  \"message\": \"Meta not found\"\n}"
      tags:
        - 'Custom Meta'
    put:
      summary: 'Set/update satu meta by key.'
      operationId: setupdateSatuMetaByKey
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  key: theme
                  value: dark
                properties:
                  key:
                    type: string
                    example: theme
                  value:
                    type: string
                    example: dark
      tags:
        - 'Custom Meta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: mixed
                  description: 'Nilai meta.'
                  example: dark
              required:
                - value
    delete:
      summary: 'Hapus satu meta by key.'
      operationId: hapusSatuMetaByKey
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Meta deleted'
                properties:
                  message:
                    type: string
                    example: 'Meta deleted'
        404:
          description: tidak
          content:
            text/plain:
              schema:
                type: string
                example: "ditemukan {\n  \"message\": \"Meta not found\"\n}"
      tags:
        - 'Custom Meta'
    parameters:
      -
        in: path
        name: type
        description: 'Short entity type.'
        example: user
        required: true
        schema:
          type: string
      -
        in: path
        name: id
        description: 'Entity id.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: key
        description: 'Meta key.'
        example: theme
        required: true
        schema:
          type: string
  /api/health:
    get:
      summary: 'Cek kesehatan API.'
      operationId: cekKesehatanAPI
      description: 'Mengecek apakah layanan API berjalan dengan baik.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  service: wasnaker-api
                  status: ok
                  time: '2026-08-27T00:00:00+00:00'
                properties:
                  service:
                    type: string
                    example: wasnaker-api
                  status:
                    type: string
                    example: ok
                  time:
                    type: string
                    example: '2026-08-27T00:00:00+00:00'
      tags:
        - Endpoints
      security: []
  /api/login:
    get:
      summary: ''
      operationId: getApiLogin
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
  /api/user:
    get:
      summary: 'Data user yang sedang login.'
      operationId: dataUserYangSedangLogin
      description: 'Mengembalikan data user terkini berdasarkan token Sanctum yang terkirim.'
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: Admin
                  email: admin@wasnaker.lan
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: Admin
                  email:
                    type: string
                    example: admin@wasnaker.lan
        401:
          description: 'tidak terautentikasi'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
  /api/v1/sales:
    get:
      summary: 'Daftar sales.'
      operationId: daftarSales
      description: 'Menampilkan daftar sales dengan paginasi.'
      parameters:
        -
          in: query
          name: page
          description: 'Nomor halaman.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Nomor halaman.'
            example: 1
        -
          in: query
          name: per_page
          description: 'Jumlah data per halaman.'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Jumlah data per halaman.'
            example: 15
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data: []
                  meta:
                    count: 0
                    per_page: 15
                    page: 1
                properties:
                  data:
                    type: array
                    example: []
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 0
                      per_page:
                        type: integer
                        example: 15
                      page:
                        type: integer
                        example: 1
      tags:
        - Endpoints
      security: []
    post:
      summary: 'Buat sales baru.'
      operationId: buatSalesBaru
      description: ''
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data: null
                properties:
                  data:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: numeric
                  description: 'Jumlah nominal sales.'
                  example: '150000'
                due_date:
                  type: date
                  description: 'Tenggat waktu.'
                  example: '2026-09-30'
              required:
                - amount
      security: []
  '/api/v1/sales/{id}':
    get:
      summary: 'Detail sales.'
      operationId: detailSales
      description: 'Mengembalikan satu data sales berdasarkan ID.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data: null
                properties:
                  data:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Endpoints
      security: []
    put:
      summary: 'Perbarui sales.'
      operationId: perbaruiSales
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data: null
                properties:
                  data:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: numeric
                  description: 'Jumlah nominal sales.'
                  example: '175000'
              required:
                - amount
      security: []
    delete:
      summary: 'Hapus sales.'
      operationId: hapusSales
      description: ''
      parameters: []
      responses:
        204:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: ''
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'ID sales.'
        example: 17
        required: true
        schema:
          type: integer
  /api/files/limits:
    get:
      summary: 'Batas maksimal upload (utility, dari php.ini).'
      operationId: batasMaksimalUploadutilityDariPhpini
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  max_bytes: 2097152
                  max_human: '2 MB'
                  max_post_bytes: 8388608
                properties:
                  max_bytes:
                    type: integer
                    example: 2097152
                  max_human:
                    type: string
                    example: '2 MB'
                  max_post_bytes:
                    type: integer
                    example: 8388608
      tags:
        - Files
  /api/files:
    post:
      summary: 'Upload file baru.'
      operationId: uploadFileBaru
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  rel_type: invoice
                  rel_id: 10
                  original_name: doc.pdf
                  mime_type: application/pdf
                  size: 12345
                  extension: pdf
                properties:
                  id:
                    type: integer
                    example: 1
                  rel_type:
                    type: string
                    example: invoice
                  rel_id:
                    type: integer
                    example: 10
                  original_name:
                    type: string
                    example: doc.pdf
                  mime_type:
                    type: string
                    example: application/pdf
                  size:
                    type: integer
                    example: 12345
                  extension:
                    type: string
                    example: pdf
      tags:
        - Files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'File yang diupload.'
                rel_type:
                  type: string
                  description: 'Tipe entity (invoice, client, task).'
                  example: invoice
                rel_id:
                  type: integer
                  description: 'ID entity.'
                  example: 10
                tenant_id:
                  type: integer
                  description: 'optional ID tenant (multi-tenant).'
                  example: 1
                  nullable: true
                disk:
                  type: string
                  description: "optional 'local' (default, private) | 'public'."
                  example: local
                  nullable: true
              required:
                - file
                - rel_type
                - rel_id
  '/api/files/{id}':
    get:
      summary: 'Ambil meta attachment.'
      operationId: ambilMetaAttachment
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Files
    delete:
      summary: 'Hapus attachment (file fisik + meta).'
      operationId: hapusAttachmentfileFisik+Meta
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Attachment deleted'
                properties:
                  message:
                    type: string
                    example: 'Attachment deleted'
      tags:
        - Files
    parameters:
      -
        in: path
        name: id
        description: 'Attachment id.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/files/{id}/download':
    get:
      summary: 'Download file (force attachment).'
      operationId: downloadFileforceAttachment
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Files
    parameters:
      -
        in: path
        name: id
        description: 'Attachment id.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/files/{id}/preview':
    get:
      summary: 'Preview file inline (image/pdf).'
      operationId: previewFileInlineimagepdf
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Files
    parameters:
      -
        in: path
        name: id
        description: 'Attachment id.'
        example: 1
        required: true
        schema:
          type: integer
  /api/gdpr/export:
    get:
      summary: 'Export semua data user.'
      operationId: exportSemuaDataUser
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    user:
                      id: 1
                      name: ...
                      email: ...
                    meta: []
                    attachments: []
                    activity_logs: []
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: ...
                          email:
                            type: string
                            example: ...
                      meta:
                        type: array
                        example: []
                      attachments:
                        type: array
                        example: []
                      activity_logs:
                        type: array
                        example: []
      tags:
        - GDPR
    parameters:
      -
        in: path
        name: user_id
        description: 'ID user.'
        example: 1
        required: true
        schema:
          type: integer
  /api/gdpr/anonymize:
    post:
      summary: 'Anonymize data user.'
      operationId: anonymizeDataUser
      description: ''
      parameters: []
      responses:
        200:
