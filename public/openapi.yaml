openapi: 3.0.3
info:
  title: 'Wasnaker API API Documentation'
  description: 'API resmi platform Wasnaker. Kontrak konsisten untuk semua frontend (web/mobile). Autentikasi via Laravel Sanctum (Bearer token).'
  version: 1.0.0
servers:
  -
    url: 'http://wasnaker.lan'
tags:
  -
    name: api/v1
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/v1/health:
    get:
      summary: ''
      operationId: getApiV1Health
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  service: wasnaker-api
                  status: ok
                  time: '2026-08-27T00:00:00+00:00'
                properties:
                  service:
                    type: string
                    example: wasnaker-api
                  status:
                    type: string
                    example: ok
                  time:
                    type: string
                    example: '2026-08-27T00:00:00+00:00'
      tags:
        - api/v1
      security: []
  /api/v1/login:
    get:
      summary: 'Endpoint login (belum terautentikasi).'
      operationId: endpointLoginbelumTerautentikasi
      description: 'Path tujuan saat klien belum terautentikasi (route bernama `login`).'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: ''
                    type: object
                    example:
                      message: Unauthenticated.
                    properties:
                      message:
                        type: string
                        example: Unauthenticated.
                  -
                    description: ''
                    type: object
                    example:
                      message: Unauthenticated.
                    properties:
                      message:
                        type: string
                        example: Unauthenticated.
      tags:
        - api/v1
      security: []
  /api/v1/user:
    get:
      summary: ''
      operationId: getApiV1User
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: Admin
                  email: admin@wasnaker.lan
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: Admin
                  email:
                    type: string
                    example: admin@wasnaker.lan
        401:
          description: 'tidak terautentikasi'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - api/v1
  '/api/v1/settings/{key}':
    get:
      summary: 'Ambil satu setting berdasarkan key.'
      operationId: ambilSatuSettingBerdasarkanKey
      description: ''
      parameters:
        -
          in: query
          name: tenant_id
          description: 'optional Scope tenant. Null = global.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'optional Scope tenant. Null = global.'
            example: 1
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  key: invoice_prefix
                  value: INV-
                  tenant_id: null
                properties:
                  key:
                    type: string
                    example: invoice_prefix
                  value:
                    type: string
                    example: INV-
                  tenant_id:
                    type: string
                    example: null
                    nullable: true
        404:
          description: 'tidak ditemukan'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Setting not found'
                properties:
                  message:
                    type: string
                    example: 'Setting not found'
      tags:
        - api/v1
    put:
      summary: 'Simpan / perbarui setting (upsert by key).'
      operationId: simpanPerbaruiSettingupsertByKey
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  key: invoice_prefix
                  value: INV-
                  tenant_id: null
                properties:
                  key:
                    type: string
                    example: invoice_prefix
                  value:
                    type: string
                    example: INV-
                  tenant_id:
                    type: string
                    example: null
                    nullable: true
      tags:
        - api/v1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: 'Nilai setting.'
                  example: INV-
                tenant_id:
                  type: integer
                  description: 'optional Scope tenant. Null = global.'
                  example: 1
              required:
                - value
    delete:
      summary: 'Hapus setting berdasarkan key.'
      operationId: hapusSettingBerdasarkanKey
      description: ''
      parameters:
        -
          in: query
          name: tenant_id
          description: 'optional Scope tenant. Null = global.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'optional Scope tenant. Null = global.'
            example: 1
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Setting deleted'
                properties:
                  message:
                    type: string
                    example: 'Setting deleted'
        404:
          description: 'tidak ditemukan'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Setting not found'
                properties:
                  message:
                    type: string
                    example: 'Setting not found'
      tags:
        - api/v1
    parameters:
      -
        in: path
        name: key
        description: 'Kunci setting.'
        example: invoice_prefix
        required: true
        schema:
          type: string
  /api/v1/settings/bulk:
    post:
      summary: 'Ambil banyak setting sekaligus.'
      operationId: ambilBanyakSettingSekaligus
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    invoice_prefix: INV-
                    tax_rate: '11'
                properties:
                  data:
                    type: object
                    properties:
                      invoice_prefix:
                        type: string
                        example: INV-
                      tax_rate:
                        type: string
                        example: '11'
      tags:
        - api/v1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keys:
                  type: array
                  description: 'Daftar key.'
                  example:
                    - invoice_prefix
                    - tax_rate
                  items:
                    type: string
                tenant_id:
                  type: integer
                  description: 'optional Scope tenant. Null = global.'
                  example: 1
              required:
                - keys
  /api/v1/activity-logs:
    get:
      summary: 'List log aktivitas (server-side list: paging, sort, filter, search, include).'
      operationId: listLogAktivitasserverSideListPagingSortFilterSearchInclude
      description: "Pengganti `data_tables_init()` Perfex — kontrak DataTables diterjemahkan\nke query param REST:\n  ?sort=-created_at,id            (whitelist, prefix - = DESC)\n  &filter[tenant_id]=1            (exact)\n  &filter[causer_id]=1            (exact)\n  &filter[subject_type]=...       (exact)\n  &filter[subject_id]=5           (exact)\n  &filter[description]=cari       (partial / LIKE)\n  &search=...                     (global search: description + subject_type)\n  &include=causer,tenant          (eager load relasi)\n  &per_page=25&page=2             (pagination)"
      parameters:
        -
          in: query
          name: sort
          description: 'optional Kolom urut (whitelist): id, description, subject_type, subject_id, causer_id, tenant_id, created_at; prefix - untuk DESC.'
          example: '-created_at'
          required: false
          schema:
            type: string
            description: 'optional Kolom urut (whitelist): id, description, subject_type, subject_id, causer_id, tenant_id, created_at; prefix - untuk DESC.'
            example: '-created_at'
        -
          in: query
          name: 'filter[tenant_id]'
          description: 'optional Filter exact tenant.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'optional Filter exact tenant.'
            example: 1
        -
          in: query
          name: 'filter[causer_id]'
          description: 'optional Filter exact user penyebab.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'optional Filter exact user penyebab.'
            example: 1
        -
          in: query
          name: 'filter[subject_type]'
          description: 'optional Filter exact tipe subjek.'
          example: App\Models\Invoice
          required: false
          schema:
            type: string
            description: 'optional Filter exact tipe subjek.'
            example: App\Models\Invoice
        -
          in: query
          name: 'filter[subject_id]'
          description: 'optional Filter exact id subjek.'
          example: 5
          required: false
          schema:
            type: integer
            description: 'optional Filter exact id subjek.'
            example: 5
        -
          in: query
          name: 'filter[description]'
          description: 'optional Filter partial (LIKE) deskripsi.'
          example: invoice
          required: false
          schema:
            type: string
            description: 'optional Filter partial (LIKE) deskripsi.'
            example: invoice
        -
          in: query
          name: search
          description: 'optional Pencarian global (description + subject_type).'
          example: invoice
          required: false
          schema:
            type: string
            description: 'optional Pencarian global (description + subject_type).'
            example: invoice
        -
          in: query
          name: include
          description: 'optional Relasi yang di-eager-load: causer,subject,tenant (pisahkan koma).'
          example: 'causer,tenant'
          required: false
          schema:
            type: string
            description: 'optional Relasi yang di-eager-load: causer,subject,tenant (pisahkan koma).'
            example: 'causer,tenant'
        -
          in: query
          name: per_page
          description: 'optional Jumlah per halaman (max 100).'
          example: 25
          required: false
          schema:
            type: integer
            description: 'optional Jumlah per halaman (max 100).'
            example: 25
        -
          in: query
          name: page
          description: 'optional Halaman.'
          example: 2
          required: false
          schema:
            type: integer
            description: 'optional Halaman.'
            example: 2
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      description: 'Invoice dibuat'
                      subject_type: App\Models\Invoice
                      subject_id: 5
                      causer_type: App\Models\User
                      causer_id: 1
                      tenant_id: 1
                      properties:
                        ip: 127.0.0.1
                      created_at: '2026-08-28T00:00:00+00:00'
                  links:
                    first: '...?page=1'
                    last: '...?page=3'
                    next: '...?page=2'
                    prev: null
                  meta:
                    current_page: 2
                    from: 26
                    last_page: 3
                    per_page: 25
                    to: 50
                    total: 80
                    total_filtered: 50
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        description: 'Invoice dibuat'
                        subject_type: App\Models\Invoice
                        subject_id: 5
                        causer_type: App\Models\User
                        causer_id: 1
                        tenant_id: 1
                        properties:
                          ip: 127.0.0.1
                        created_at: '2026-08-28T00:00:00+00:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        description:
                          type: string
                          example: 'Invoice dibuat'
                        subject_type:
                          type: string
                          example: App\Models\Invoice
                        subject_id:
                          type: integer
                          example: 5
                        causer_type:
                          type: string
                          example: App\Models\User
                        causer_id:
                          type: integer
                          example: 1
                        tenant_id:
                          type: integer
                          example: 1
                        properties:
                          type: object
                          properties:
                            ip:
                              type: string
                              example: 127.0.0.1
                        created_at:
                          type: string
                          example: '2026-08-28T00:00:00+00:00'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: '...?page=1'
                      last:
                        type: string
                        example: '...?page=3'
                      next:
                        type: string
                        example: '...?page=2'
                      prev:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 2
                      from:
                        type: integer
                        example: 26
                      last_page:
                        type: integer
                        example: 3
                      per_page:
                        type: integer
                        example: 25
                      to:
                        type: integer
                        example: 50
                      total:
                        type: integer
                        example: 80
                      total_filtered:
                        type: integer
                        example: 50
      tags:
        - api/v1
    post:
      summary: 'Catat log aktivitas baru.'
      operationId: catatLogAktivitasBaru
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  description: 'Invoice dibuat'
                  subject_type: App\Models\Invoice
                  subject_id: 5
                  causer_type: App\Models\User
                  causer_id: 1
                  tenant_id: 1
                  properties:
                    ip: 127.0.0.1
                  created_at: '2026-08-28T00:00:00+00:00'
                properties:
                  id:
                    type: integer
                    example: 1
                  description:
                    type: string
                    example: 'Invoice dibuat'
                  subject_type:
                    type: string
                    example: App\Models\Invoice
                  subject_id:
                    type: integer
                    example: 5
                  causer_type:
                    type: string
                    example: App\Models\User
                  causer_id:
                    type: integer
                    example: 1
                  tenant_id:
                    type: integer
                    example: 1
                  properties:
                    type: object
                    properties:
                      ip:
                        type: string
                        example: 127.0.0.1
                  created_at:
                    type: string
                    example: '2026-08-28T00:00:00+00:00'
      tags:
        - api/v1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: 'Deskripsi aktivitas.'
                  example: 'Invoice dibuat'
                subject_type:
                  type: string
                  description: 'optional Tipe subjek (FQCN).'
                  example: App\Models\Invoice
                  nullable: true
                subject_id:
                  type: integer
                  description: 'optional ID subjek.'
                  example: 5
                  nullable: true
                causer_id:
                  type: integer
                  description: 'optional ID user penyebab.'
                  example: 1
                  nullable: true
                tenant_id:
                  type: integer
                  description: 'optional Scope tenant.'
                  example: 1
                  nullable: true
                properties:
                  type: object
                  description: 'optional Data tambahan.'
                  example:
                    ip: 127.0.0.1
                  properties: {  }
                  nullable: true
              required:
                - description
