            application/json:
              schema:
                type: object
                example:
                  data:
                    theme: dark
                    language: id
                properties:
                  data:
                    type: object
                    properties:
                      theme:
                        type: string
                        example: dark
                      language:
                        type: string
                        example: id
      tags:
        - api/v1
    post:
      summary: 'Bulk set meta (replace) untuk entity.'
      operationId: bulkSetMetareplaceUntukEntity
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    theme: dark
                    language: id
                properties:
                  data:
                    type: object
                    properties:
                      theme:
                        type: string
                        example: dark
                      language:
                        type: string
                        example: id
      tags:
        - api/v1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                meta:
                  type: object
                  description: 'Map key=>value.'
                  example:
                    theme: dark
                    language: id
                  properties: {  }
              required:
                - meta
    parameters:
      -
        in: path
        name: type
        description: 'Short entity type (allowlist).'
        example: user
        required: true
        schema:
          type: string
      -
        in: path
        name: id
        description: 'Entity id.'
        example: 1
        required: true
        schema:
          type: integer
