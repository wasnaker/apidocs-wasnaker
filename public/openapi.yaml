          description: 'tidak ditemukan'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Meta not found'
                properties:
                  message:
                    type: string
                    example: 'Meta not found'
      tags:
        - api/v1
    put:
      summary: 'Set/update satu meta by key.'
      operationId: setupdateSatuMetaByKey
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  key: theme
                  value: dark
                properties:
                  key:
                    type: string
                    example: theme
                  value:
                    type: string
