      summary: 'Kirim notifikasi realtime ke user yang sedang login.'
      operationId: kirimNotifikasiRealtimeKeUserYangSedangLogin
      description: "Memicu event `notification.sent` di private channel `user.{id}`.\nFrontend (Next.js) mendengarkan channel tersebut lalu menampilkan\ndesktop notification via browser Notification API."
      parameters: []
      responses:
        200:
          description: terkirim
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  event: notification.sent
                  channel: user.1
                  payload:
                    title: 'Pesan baru'
                    message: 'Anda menerima pesan baru'
                    type: success
                    data: []
                    sent_at: '2026-08-29T00:00:00+07:00'
                properties:
                  success:
                    type: boolean
                    example: true
                  event:
                    type: string
                    example: notification.sent
                  channel:
                    type: string
                    example: user.1
                  payload:
                    type: object
                    properties:
                      title:
                        type: string
                        example: 'Pesan baru'
                      message:
                        type: string
                        example: 'Anda menerima pesan baru'
                      type:
                        type: string
                        example: success
                      data:
                        type: array
                        example: []
                      sent_at:
                        type: string
                        example: '2026-08-29T00:00:00+07:00'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    type:
                      - 'The selected type is invalid.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      type:
                        type: array
                        example:
                          - 'The selected type is invalid.'
                        items:
                          type: string
      tags:
        - api/v1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 'optional Judul notifikasi.'
                  example: 'Pesan baru'
                message:
                  type: string
                  description: 'optional Isi notifikasi.'
                  example: 'Anda menerima pesan baru'
                type:
                  type: string
                  description: 'optional Tipe notifikasi: info|success|warning|error.'
                  example: success
                data:
                  type: array
                  description: 'optional Data tambahan bebas (JSON object).'
                  example:
                    - consequatur
                  items:
                    type: string
